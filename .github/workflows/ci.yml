name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: inf2006-ci
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Initialize disposable local configuration
        run: >-
          docker run --rm --user "$(id -u):$(id -g)"
          --mount "type=bind,source=$PWD/src,target=/work"
          python:3.13-slim-bookworm@sha256:ed86c82274b3c69b52fb5820f358f0bd7df0b603332063cb5c6e32bd220c3e6e
          python /work/tools/init_env.py
      - name: Build pinned application image
        run: docker compose build web
      - name: Start PostgreSQL
        run: docker compose up --wait --wait-timeout 90 db
      - name: Apply migrations
        run: docker compose run --rm --no-deps migrate
      - name: Check Django configuration
        run: docker compose run --rm --no-deps web python manage.py check
      - name: Check for missing migrations
        run: docker compose run --rm --no-deps web python manage.py makemigrations --check --dry-run
      - name: Run pytest suite
        run: docker compose run --rm --no-deps web pytest -q -p no:cacheprovider /app/tests
      - name: Remove disposable CI database and containers
        if: always()
        run: docker compose down --volumes --remove-orphans
