name: inf2006-foundation
services:
  db:
    image: postgres:17-bookworm@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Run tools/init_env.py first}
      APP_DB_NAME: ${POSTGRES_DB:?Run tools/init_env.py first}
      APP_DB_USER: ${POSTGRES_USER:?Run tools/init_env.py first}
      APP_DB_PASSWORD: ${POSTGRES_PASSWORD:?Run tools/init_env.py first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/10-local-role.sh:/docker-entrypoint-initdb.d/10-local-role.sh:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
  web:
    build: .
    image: inf2006-foundation-app
    environment: &app-environment
      DJANGO_ENV: local
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Run tools/init_env.py first}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DJANGO_TRUST_PROXY: "false"
      POSTGRES_DB: ${POSTGRES_DB:?Run tools/init_env.py first}
      POSTGRES_USER: ${POSTGRES_USER:?Run tools/init_env.py first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run tools/init_env.py first}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    volumes:
      - ../tests:/app/tests:ro,z
      - ../data:/app/data:ro,z
  migrate:
    build: .
    image: inf2006-foundation-app
    environment: *app-environment
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
volumes:
  postgres_data:
