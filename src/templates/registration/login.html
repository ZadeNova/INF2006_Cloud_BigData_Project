{% extends "base.html" %}
{% block title %}Log in — 42Factors{% endblock %}
{% block content %}
<section class="auth-page" aria-labelledby="login-title">
    <div class="surface-card auth-page__card">
        <p class="eyebrow"><span class="eyebrow__line" aria-hidden="true"></span> Account</p>
        <h1 id="login-title">Log in</h1>
        <form class="auth-form" method="post" novalidate>
            {% csrf_token %}
            {% include "accounts/_form_fields.html" %}
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit" class="button button--dark">Log in</button>
        </form>
        <p class="form-note">Need an account? <a href="{% url 'accounts:register' %}">Register</a>.</p>
    </div>
</section>
{% endblock %}
