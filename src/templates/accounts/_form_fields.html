{% for field in form %}
<div class="form-field{% if field.errors %} form-field--invalid{% endif %}">
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% for error in field.errors %}
    <p class="form-error" id="{{ field.id_for_label }}-error">{{ error }}</p>
    {% endfor %}
    {% if field.help_text %}
    <p class="form-note" id="{{ field.id_for_label }}-help">{{ field.help_text|safe }}</p>
    {% endif %}
</div>
{% endfor %}
{% if form.non_field_errors %}
<div class="message message--error" role="alert">
    <span class="message__icon" aria-hidden="true">!</span>
    <div>
        {% for error in form.non_field_errors %}<p>{{ error }}</p>{% endfor %}
    </div>
</div>
{% endif %}
