data_ai:
  dataset: "data/README.md"
  method: "Accepted synthetic CSV import with sealed historical inventory; SQL refresh independently checked by raw-table pandas recomputation and a separately exported production coverage target."
  evaluation: "evidence/test-data-ai.md: independent deterministic refresh verification and executed ML checks; evidence/ml-quality-evaluation.json: accepted raw revision aggregate comparison, lifetime eligibility, source/code identity, k=2..4 profiles/separation/seed stability. Selected descriptive recipe (rfm-v3-<sha256>, exact value per training run in evidence/test-data-ai.md) uses log_rfm_aov inputs (log recency, log frequency, log average order value; review M-03), k=2 on the shoe cohort; no predictive claim. evidence/ml-holdout-evaluation.json: shoe-dataset comparison of log_frequency and log_rfm_aov with input skew/correlation, 80% subsample ARI for k=2..4 and a 90-day time-split check (segments show no repurchase difference on this synthetic data). ML quality review status: docs/reviews/ml-quality-evaluation.md."
  reproducible_command: "python analytics/verify_refresh.py --run-id <UUID> --coverage-target coverage.json; first export with analytics/export_coverage.py (full setup in evidence/test-data-ai.md)"
  source_version: "Analytics Engineering Ecommerce Sales & Returns v1.0.0; downloaded 2026-09-22; data/raw/checksums.txt"
  derived_dataset: "data/derived/shoes/, rebuilt from unchanged data/raw/ by analytics/build_shoe_dataset.py; data/derived/shoes/checksums.txt"
  verified_scratch_namespace: "synthetic/shoes/data-check/v1"
  verified_seed: 42
  verified_shift_offset_days: 0
  verified_inventory_cutoff: "2026-01-02T00:00:00+08:00"
  verified_inventory_version: "import-v1-3e9692771fda3d5bf9ad09840c3dc403866948527925e7e639f81b0aa3c025e8"

security:
  threat_control_map: "evidence/threat-control-map.md"
  secrets_handling: "Local: src/tools/init_env.py generates random secrets into the git-ignored src/.env without printing them. Production: the database credentials and Django signing key are read from AWS Secrets Manager at startup using role credentials only, with no plaintext or static-credential fallback (src/config/secrets.py; docs/AWS_INFRASTRUCTURE.md#secrets-manager-startup-and-alb-boundary). Verified on AWS variants A and B: evidence/test-security.md SEC-11 and SEC-18, 2026-10-08 and 2026-10-09."

run:
  prerequisites:
    - "Docker Desktop with Linux containers and Docker Compose"
    - "Python 3 for the optional host environment initializer; Docker-only alternative in src/README.md"
  commands:
    - "python src/tools/init_env.py"
    - "docker compose -f src/compose.yaml build"
    - "docker compose -f src/compose.yaml run --rm web python manage.py migrate --noinput"
    - "docker compose -f src/compose.yaml up -d --wait --wait-timeout 60 web"
    - "docker compose -f src/compose.yaml run --rm web python manage.py check_database"
    - "docker compose -f src/compose.yaml run --rm web pytest -q -p no:cacheprovider /app/tests"

